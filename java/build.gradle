plugins {
	id 'java-library'
	id 'org.springframework.boot' version '4.1.2'
	// Maven Central 배포 (0.36+ 는 Gradle 9 필요 > wrapper 8.14 에 맞춰 0.35.0)
	id 'com.vanniktech.maven.publish' version '0.37.0'
}

// group, version: 루트 build.gradle (세 언어 공통 버전, projectops 가 갱신)
description = 'Sejong University integrated library for Spring Boot: portal login and public school data'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
	// Spring Boot 지원을 선택 기능으로 분리 (main 소스 공유)
	registerFeature('springBootSupport') {
		usingSourceSet(sourceSets.main)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot BOM 을 Gradle platform 으로 (배포 메타데이터·POM 에 버전 포함 > Spring Boot 아닌 프로젝트도 의존성 해석)
	def springBootBom = platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
	implementation springBootBom
	compileOnly springBootBom
	annotationProcessor springBootBom
	testCompileOnly springBootBom
	testAnnotationProcessor springBootBom

	// Spring Boot: 선택 의존성 (자동 설정·TLS 초기화용, Spring 없이 쓰면 받지 않음 > POM optional)
	springBootSupportImplementation springBootBom
	springBootSupportImplementation 'org.springframework.boot:spring-boot-autoconfigure'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// 로깅 API (Lombok @Slf4j, 구현체는 사용하는 앱이 선택)
	implementation 'org.slf4j:slf4j-api'

	// HTTP Client (OkHttp)
	implementation 'com.squareup.okhttp3:okhttp:5.5.1'
	implementation 'com.squareup.okhttp3:okhttp-urlconnection:5.5.1'

	// HTML Parser (Jsoup)
	implementation 'org.jsoup:jsoup:1.23.2'

	// JSON Parser (Jackson)
	implementation 'com.fasterxml.jackson.core:jackson-databind'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootJar { enabled = false }
// Boot 플러그인 기본 classifier(plain) 제거 > Maven 사용자가 받는 기본 jar 이름(sejongpeia-{버전}.jar)
jar {
	enabled = true
	archiveClassifier = ''
}

// javadoc: 한국어 주석의 '>' 흐름 표기 등을 doclint 오류로 막지 않음
tasks.withType(Javadoc).configureEach {
	options.encoding = 'UTF-8'
	options.addBooleanOption('Xdoclint:none', true)
}

// 배포 (publication 이름 maven: GitHub Packages 워크플로우가 publishMavenPublicationToGitHubPackagesRepository 호출)
mavenPublishing {
	// Maven Central: 자격증명이 있을 때만 (PROJECT-SEJONG-JAVA-CENTRAL-PUBLISH 의 MAVEN_CENTRAL_* Secret), 자동 게시
	// GRADLE_PROPERTIES(Nexus 배포용)에는 Central 값을 넣지 않음 > 넣으면 Nexus 워크플로우의 publish 가 Central 에도 올림
	if (project.findProperty('mavenCentralUsername')) {
		publishToMavenCentral(true)
	}
	if (project.findProperty('signingInMemoryKey')) {
		signAllPublications()
	}
	coordinates(project.group.toString(), project.name, project.version.toString())
	pom {
		name = 'sejongpeia'
		description = 'Sejong University integrated library for Java and Spring Boot: portal login and public school data (세종대 로그인 API)'
		url = 'https://github.com/Cassiiopeia/pro-sejongpeia'
		inceptionYear = '2025'
		licenses {
			license {
				name = 'MIT License'
				url = 'https://opensource.org/licenses/MIT'
				distribution = 'repo'
			}
		}
		developers {
			developer {
				id = 'Cassiiopeia'
				name = 'SUH SAECHAN'
				url = 'https://github.com/Cassiiopeia'
			}
		}
		scm {
			url = 'https://github.com/Cassiiopeia/pro-sejongpeia'
			connection = 'scm:git:https://github.com/Cassiiopeia/pro-sejongpeia.git'
			developerConnection = 'scm:git:ssh://git@github.com/Cassiiopeia/pro-sejongpeia.git'
		}
	}
}

publishing {
	repositories {
		// SUH Nexus: 기존 사용자(lab 서버 등) 호환용으로 유지
		maven {
			name = 'nexus'
			url = uri(
					version.toString().endsWith('SNAPSHOT')
							? "https://nexus.suhsaechan.kr/repository/maven-snapshots/"
							: "https://nexus.suhsaechan.kr/repository/maven-releases/"
			)
			credentials {
				username = project.findProperty('nexusUsername')
				password = project.findProperty('nexusPassword')
			}
		}
		// GitHub Packages: GITHUB_TOKEN 있는 워크플로우에서만 등록 (Nexus 배포의 publish 에 섞이지 않게)
		if (System.getenv('GITHUB_TOKEN')) {
			maven {
				name = 'GitHubPackages'
				url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY')}")
				credentials {
					username = System.getenv('GITHUB_ACTOR')
					password = System.getenv('GITHUB_TOKEN')
				}
			}
		}
	}
}
