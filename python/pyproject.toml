[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pro-sejongpeia"
version = "1.2.30"
description = "Sejong University login API and school data for Python: verify students with portal SSO, plus course lists, calendar, cafeteria and dormitory menus without login (세종대 로그인 API, 개설강좌, 학식)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suh Saechan" }]
keywords = ["sejong", "sejong-university", "세종대", "authentication", "sso", "student-verification", "course-list", "cafeteria-menu", "academic-calendar"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Natural Language :: Korean",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://cassiiopeia.github.io/pro-sejongpeia/"
Source = "https://github.com/Cassiiopeia/pro-sejongpeia"
Issues = "https://github.com/Cassiiopeia/pro-sejongpeia/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sejongpeia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
