[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pro-sejongpeia"
version = "1.2.73"
description = "Sejong University integrated library for Python: portal login (SSO) and public school data (세종대 통합 라이브러리, 세종대 로그인 API)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suh Saechan" }]
keywords = ["sejong", "sejong-university", "세종대", "authentication", "sso", "student-verification", "school-data", "courses", "curriculum", "academic-calendar", "세종대학교"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Natural Language :: Korean",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.urls]
Homepage = "https://cassiiopeia.github.io/pro-sejongpeia/"
Source = "https://github.com/Cassiiopeia/pro-sejongpeia"
Issues = "https://github.com/Cassiiopeia/pro-sejongpeia/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sejongpeia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
