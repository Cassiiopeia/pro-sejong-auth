# Python 패키지 PyPI 배포 (deploy 브랜치 push = 릴리스, Trusted Publishing: 토큰 저장 없음)
# PyPI 설정: owner Cassiiopeia, repo pro-sejongpeia, workflow PROJECT-SEJONG-PYPI-PUBLISH.yml, environment pypi
name: PROJECT-SEJONG-PYPI-PUBLISH

on:
  push:
    branches: ["deploy"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    # 수동 실행도 deploy 브랜치에서만 (공개 저장소 버전은 지울 수 없음)
    if: github.ref == 'refs/heads/deploy'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pro-sejongpeia
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Test and build
        working-directory: python
        run: |
          python -m pip install --upgrade pip pytest build
          python -m pytest -q
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: python/dist/
          skip-existing: true
