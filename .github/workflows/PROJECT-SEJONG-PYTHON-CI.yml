# Python 패키지 테스트 (python/, spec/ 변경 시, 지원 버전 3.9 ~ 3.13)
name: PROJECT-SEJONG-PYTHON-CI

on:
  push:
    branches: ["main", "deploy"]
    paths: ["python/**", "spec/**", ".github/workflows/PROJECT-SEJONG-PYTHON-CI.yml"]
  pull_request:
    paths: ["python/**", "spec/**", ".github/workflows/PROJECT-SEJONG-PYTHON-CI.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        working-directory: python
        run: |
          python -m pip install --upgrade pip pytest build
          python -m pytest -q
          python -m build
