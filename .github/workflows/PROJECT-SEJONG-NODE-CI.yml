# Node 패키지 테스트 (node/, spec/ 변경 시, 지원 버전 18 ~ 22)
name: PROJECT-SEJONG-NODE-CI

on:
  push:
    branches: ["main", "deploy"]
    paths: ["node/**", "spec/**", ".github/workflows/PROJECT-SEJONG-NODE-CI.yml"]
  pull_request:
    paths: ["node/**", "spec/**", ".github/workflows/PROJECT-SEJONG-NODE-CI.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test
        working-directory: node
        run: |
          npm ci
          npm test
