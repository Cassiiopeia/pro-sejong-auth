# 실제 포털 정기 점검: 세 언어 정상 인증 (scripts/live-check.sh) > 실패 시 이슈 1개 생성
#   Secret 2개: SEJONG_TEST_STUDENT_ID, SEJONG_TEST_PASSWORD (없으면 건너뜀)
#   계정 잠금 방지: 틀린 비밀번호 시도 없음, 점검 실패 이슈가 열려 있으면 정기 실행은 로그인하지 않음 (수동 실행만)
# 학교 참조 데이터 형태 점검: 계정 없이 요청 3건 (scripts/probe-reference-data.py) > 실패 시 이슈 1개 생성 (로그인 점검과 별도 잡)
name: PROJECT-SEJONG-LIVE-CHECK

on:
  schedule:
    # 매일 09:00 KST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sejong-live-check
  cancel-in-progress: false

env:
  # 점검 실패 이슈 제목 (열린 이슈 찾기에도 사용)
  LIVE_CHECK_ISSUE_TITLE: "❗[버그][포털] 실제 포털 정기 점검 실패 (자동 생성)"
  # 참조 데이터 형태 점검 실패 이슈 제목 (열린 이슈 찾기에도 사용)
  REFERENCE_CHECK_ISSUE_TITLE: "❗[버그][학교 데이터] 참조 데이터 형태 점검 실패 (자동 생성)"

jobs:
  live-check:
    if: github.repository == 'Cassiiopeia/pro-sejong-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Decide whether to run
        id: gate
        uses: actions/github-script@v7
        env:
          HAS_TEST_ACCOUNT: ${{ secrets.SEJONG_TEST_STUDENT_ID != '' && secrets.SEJONG_TEST_PASSWORD != '' }}
        with:
          script: |
            if (process.env.HAS_TEST_ACCOUNT !== 'true') {
              core.notice('SEJONG_TEST_* secrets not set: live check skipped');
              core.setOutput('should_run', 'false');
              return;
            }
            const openIssues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            const openFailureIssue = openIssues.find((issue) => !issue.pull_request && issue.title === process.env.LIVE_CHECK_ISSUE_TITLE);
            const isScheduled = context.eventName === 'schedule';
            if (openFailureIssue && isScheduled) {
              core.notice(`live check failure issue #${openFailureIssue.number} is open: scheduled login skipped`);
              core.setOutput('should_run', 'false');
              return;
            }
            core.setOutput('should_run', 'true');
            core.setOutput('open_issue_number', openFailureIssue ? String(openFailureIssue.number) : '');

      - uses: actions/checkout@v5
        if: steps.gate.outputs.should_run == 'true'
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.should_run == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.gate.outputs.should_run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.should_run == 'true'
        with:
          node-version: 22

      - name: Live check (three languages)
        id: check
        if: steps.gate.outputs.should_run == 'true'
        env:
          SEJONG_TEST_STUDENT_ID: ${{ secrets.SEJONG_TEST_STUDENT_ID }}
          SEJONG_TEST_PASSWORD: ${{ secrets.SEJONG_TEST_PASSWORD }}
        run: |
          (cd node && npm ci --no-audit --no-fund)
          scripts/live-check.sh

      - name: Report failure as issue
        if: failure() && steps.check.outcome == 'failure' && steps.gate.outputs.open_issue_number == ''
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '📝 현재 문제점',
              '---',
              '',
              `- 실제 포털 정기 점검(scripts/live-check.sh)이 실패했습니다: ${runUrl}`,
              '- 포털 변경(로그인 폼·SSO·TLS)이거나 테스트 계정 비밀번호 변경일 수 있습니다',
              '- 이 이슈가 열려 있는 동안 정기 실행은 로그인하지 않습니다 (계정 잠금 방지). 원인을 고친 뒤 수동 실행으로 확인하고 닫아 주세요',
            ].join('\n');
            await github.rest.issues.create({ ...context.repo, title: process.env.LIVE_CHECK_ISSUE_TITLE, body, labels: ['작업전'] });

  # 계정 없이 도는 형태 점검: 로그인이 없으므로 계정 잠금 위험이 없고, 로그인 점검의 실패 이슈와 무관하게 매일 실행
  reference-data-check:
    if: github.repository == 'Cassiiopeia/pro-sejong-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe reference data (no login)
        id: probe
        run: python3 scripts/probe-reference-data.py

      - name: Report drift as issue
        if: failure() && steps.probe.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const openIssues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', per_page: 100 });
            if (openIssues.some((issue) => !issue.pull_request && issue.title === process.env.REFERENCE_CHECK_ISSUE_TITLE)) {
              core.notice('reference data check issue is already open: no new issue');
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '📝 현재 문제점',
              '---',
              '',
              `- 학교 참조 데이터 형태 점검(scripts/probe-reference-data.py)이 실패했습니다: ${runUrl}`,
              '- 학교가 코드표나 응답 형태를 바꿨거나 서버가 일시적으로 응답하지 않았을 수 있습니다. 로그에서 `[probe] DRIFT` 줄을 확인하세요',
              '- 형태가 바뀌었다면 spec/REFERENCE_DATA.md와 세 언어 구현을 같은 PR에서 고칩니다',
            ].join('\n');
            await github.rest.issues.create({ ...context.repo, title: process.env.REFERENCE_CHECK_ISSUE_TITLE, body, labels: ['작업전'] });
