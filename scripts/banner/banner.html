<!doctype html>
<!--
  README·공유 이미지 배너 원본 (단일 원본). PNG 는 scripts/generate-banner.py 가 이 파일을 헤드리스 Chrome 으로 렌더링해 만든다.
  주소 인자: ?variant=a|b|c  &lang=ko|en  &layout=banner|og
  규칙: 크림슨이 주인공, 요소는 적게 (워드마크, 제목, 한 줄 소개, 언어 이름, 코드 창), 영문은 모두 대문자, 교표는 넣지 않음 (README 맨 위에 따로 있음)
  문구는 아래 COPY 한 곳에서만 고친다 (코드 창 주석은 숫자·날짜 없이 쓴다)
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>pro-sejongpeia banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* 브랜드 색 토큰 (website/src/styles/custom.css 의 세종 크림슨 계열과 같은 값) */
  :root {
    --crimson: #C20F2F;
    --sans: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 880px; background: #000; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  /* 무대: 배너 880x340, og 880x462 (1.3636 배율로 1200x630) */
  .stage {
    position: relative; width: 880px; height: 340px; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between; padding: 0 64px;
    background: var(--stage-background); color: var(--text-main);
  }
  body[data-layout="og"] .stage { height: 462px; }
  .stage::before { content: ""; position: absolute; inset: 0; background: var(--stage-decoration); pointer-events: none; }

  /* 왼쪽: 워드마크, 제목, 한 줄 소개, 칩 */
  .copy { position: relative; z-index: 1; width: 400px; }
  .wordmark { font-size: 13px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: var(--text-sub); }
  h1 { margin-top: 18px; font-size: 41px; line-height: 1.2; font-weight: 800; letter-spacing: -0.035em; color: var(--text-main); }
  h1 em { font-style: normal; color: var(--accent-text); }
  html[lang="en"] h1 { font-kerning: normal; text-rendering: optimizeLegibility; font-size: 31px; line-height: 1.25; letter-spacing: 0.01em; text-transform: uppercase; font-weight: 800; }
  .tight { letter-spacing: -0.07em; }
  .sub { margin-top: 18px; font-size: 17px; line-height: 1.55; word-break: keep-all; color: var(--text-sub); letter-spacing: -0.01em; }
  html[lang="en"] .sub { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; line-height: 1.8; }
  .languages { margin-top: 22px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-main); }

  /* 오른쪽: 코드 창 하나 */
  .window { position: relative; z-index: 1; width: 330px; border-radius: 12px; background: var(--window-background); border: 1px solid var(--window-border); box-shadow: var(--window-shadow); overflow: hidden; }
  .window-bar { display: flex; align-items: center; gap: 7px; padding: 11px 15px; background: var(--window-bar); border-bottom: 1px solid var(--window-border); }
  .window-bar span { width: 10px; height: 10px; border-radius: 50%; background: var(--window-dot); }
  .window-bar b { margin-left: 8px; font: 700 11px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-faint); }
  pre { padding: 16px 18px 18px; font: 500 12.4px/1.85 var(--mono); color: var(--code-text); white-space: pre; }
  .k { color: var(--code-keyword); } .s { color: var(--code-string); } .c { color: var(--code-comment); } .n { color: var(--code-number); font-weight: 700; }

  /* 시안 A: 크림슨 그라데이션 + 어두운 코드 창 (README 기본) */
  body[data-variant="a"] {
    --stage-background: linear-gradient(115deg, #D9163C 0%, #C20F2F 42%, #8E0A22 100%);
    --stage-decoration: radial-gradient(520px 340px at 92% 0%, rgba(255,255,255,0.22), transparent 70%), radial-gradient(360px 260px at 0% 110%, rgba(60,0,12,0.35), transparent 70%);
    --text-main: #FFFFFF; --text-sub: rgba(255,255,255,0.84); --text-faint: #8B93A3; --accent-text: #FFFFFF; 
    --window-background: #14161C; --window-border: rgba(255,255,255,0.10); --window-bar: #1B1E26; --window-dot: #343A47; --window-shadow: 0 22px 44px rgba(50,0,10,0.45);
    --code-text: #D7DBE4; --code-keyword: #FF7A90; --code-string: #7FD6A8; --code-comment: #6F7889; --code-number: #FFD27A;
  }
  /* 시안 B: 깊은 와인 크림슨 + 흰 코드 창 */
  body[data-variant="b"] {
    --stage-background: linear-gradient(120deg, #A30D27 0%, #7A0A1F 55%, #4E0614 100%);
    --stage-decoration: radial-gradient(480px 320px at 88% 10%, rgba(255,75,103,0.35), transparent 70%);
    --text-main: #FFFFFF; --text-sub: rgba(255,255,255,0.80); --text-faint: #8A95A3; --accent-text: #FFB3C0; 
    --window-background: #FFFFFF; --window-border: rgba(255,255,255,0.4); --window-bar: #F6F1EE; --window-dot: #D9D2CB; --window-shadow: 0 22px 44px rgba(30,0,6,0.5);
    --code-text: #2B3745; --code-keyword: #C20F2F; --code-string: #1F7A4D; --code-comment: #8A95A3; --code-number: #A15B00;
  }
  /* 시안 C: 밝은 바탕 + 큰 크림슨 면 */
  body[data-variant="c"] {
    --stage-background: #FBF8F4;
    --stage-decoration: linear-gradient(115deg, transparent 0 56%, #C20F2F 56% 100%), radial-gradient(420px 300px at 100% 0%, rgba(255,255,255,0.25), transparent 70%);
    --text-main: #1B2733; --text-sub: #4A5868; --text-faint: #8B93A3; --accent-text: #C20F2F; 
    --window-background: #14161C; --window-border: rgba(255,255,255,0.10); --window-bar: #1B1E26; --window-dot: #343A47; --window-shadow: 0 22px 44px rgba(50,0,10,0.35);
    --code-text: #D7DBE4; --code-keyword: #FF7A90; --code-string: #7FD6A8; --code-comment: #6F7889; --code-number: #FFD27A;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="copy">
    <div class="wordmark">Pro Sejongpeia</div>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <p class="languages">Java · Python · Node.js</p>
  </div>
  <div class="window">
    <div class="window-bar"><span></span><span></span><span></span><b>main.py</b></div>
<pre><span class="k">from</span> sejongpeia <span class="k">import</span> SejongPublicData
data = SejongPublicData()
data.lectures(<span class="s">"20"</span>, <span class="s">"2026"</span>, <span class="s">"20"</span>)
<span class="c"># </span><span class="n" id="resultComment"></span></pre>
  </div>
</div>
<script>
  // 문구 단일 원본 (영문은 CSS 로 대문자 처리)
  const COPY = {
    ko: { title: '세종대 개발에 필요한<br><em>모든 것을 한 번에</em>', sub: '학번 인증부터 학과·강의·학사일정·학식까지', resultComment: '학기 전체 개설강좌' },
    en: { title: 'EVER<span class="tight">Y</span>THING you need<br>to build on<br><em>Sejong University</em>', sub: 'Student login · departments · lectures<br>calendar · cafeterias', resultComment: 'every course of the term' },
  };
  const query = new URLSearchParams(location.search);
  const variant = query.get('variant') || 'a', language = query.get('lang') || 'ko', layout = query.get('layout') || 'banner';
  document.body.dataset.variant = variant; document.body.dataset.layout = layout; document.documentElement.lang = language;
  const copy = COPY[language];
  document.getElementById('title').innerHTML = copy.title;
  document.getElementById('sub').innerHTML = copy.sub;
  document.getElementById('resultComment').textContent = copy.resultComment;
</script>
</body>
</html>
